# Architecture declaration (ROADMAP row 9c). Crate-granular: the workspace has
# 13 members and one real edge set (`vulkane` -> its three build-time/derive/vocab
# crates). Module groups inside `vulkane` come with row 9 (the crate::safe cycle).
[architecture]
style = "layered"

[[architecture.layer]]
name       = "leaf-crates"
components = [
  "kiss-vulkan-vocab", "vulkan_gen", "vulkane_derive",
  "vulkane-kernels-source",
  "vulkane-hlsl-parse", "vulkane-spirv-parse", "vulkane-slang-parse", "vulkane-wgsl-parse",
  "vulkane-hlsl-emit", "vulkane-spirv-emit", "vulkane-slang-emit", "vulkane-wgsl-emit",
  "vulkane-glsl-emit", "vulkane-kernel-text",
]

[[architecture.layer]]
name       = "runtime"
components = ["vulkane"]

# Per-file SPDX/licence gate (SUP-016, licence-tools#6). `copyright_expected` names files
# that legitimately carry a third party's copyright instead of ours; none is waived:
#   spdx_gate.py           - the gate script copy kept for the fleet comparison
#   THIRD-PARTY-NOTICES.md - the notices file: other people's licences, credited as written
#   vk.xml                 - the Khronos Vulkan registry: its provenance and its own licence
#                            stay credited (CireSnave: "I am not a plageurist.")
[sup016]
gate = true
licence = "MIT OR Apache-2.0"
extensions = [".rs", ".py", ".wgsl", ".comp", ".vert", ".frag", ".glsl", ".slang", ".hlsl", ".sh"]
min_files = 100
copyright_expected = ["spdx_gate.py", "THIRD-PARTY-NOTICES.md", "vk.xml"]
