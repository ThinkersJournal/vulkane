[package]
name         = "vulkane-glsl-emit"
version      = "0.31.7"
edition      = "2024"
rust-version = "1.85"
authors      = ["Eric Evans <CireSnave@gmail.com>"]
license      = "MIT OR Apache-2.0"
description  = "The GLSL compute-shader emitter for Unpopped: kernel-layer IR to GLSL 4.50 source (std430 buffers, shared arrays, barrier(), structured control flow) over the shared vulkane-kernel-text walker. Vulkane owns GLSL."
keywords     = ["kernel", "codegen", "compiler", "glsl", "shader"]
categories   = ["compilers", "development-tools", "graphics"]
repository   = "https://github.com/ThinkersJournal/vulkane"
homepage     = "https://github.com/ThinkersJournal/vulkane"
readme       = "README.md"
include      = ["src/**", "README.md", "LICENSE-*"]

[dependencies]
unpopped       = "~0.62.0"
unpopped-vocab = "~0.62.0"
vulkane-kernel-text = { path = "../vulkane-kernel-text", version = "0.31" }

[dev-dependencies]
# The published decline fixtures (ROADMAP 9h): one checker-valid kernel or module per `Stmt` variant.
unpopped = { version = "~0.62.0", features = ["fixtures"] }
# Shared test helpers (GPU lock witness, kernels, oracles): ROADMAP row 8n, in place of `#[path]` includes.
vulkane-test-support = { path = "../vulkane-test-support" }
# The live-device test opens a device through the safe wrapper (and its shared `tests/common`).
vulkane = { path = "../vulkane" }
vulkane-spirv-emit = { path = "../vulkane-spirv-emit" }

[lints.rust]
missing_docs                  = "deny"
missing_debug_implementations = "warn"
unreachable_pub               = "warn"

[lints.rustdoc]
broken_intra_doc_links  = "deny"
private_intra_doc_links = "deny"

[lints.clippy]
all                = { level = "warn", priority = -1 }
too_many_arguments = "allow"
type_complexity    = "allow"
