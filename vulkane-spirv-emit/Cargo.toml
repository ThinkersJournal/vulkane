[package]
name         = "vulkane-spirv-emit"
version      = "0.30.9"
edition      = "2024"
rust-version = "1.85"
authors      = ["Eric Evans <CireSnave@gmail.com>"]
license      = "MIT OR Apache-2.0"
description  = "The SPIR-V compute-shader emitter for Unpopped: IR to a binary SPIR-V module (GLSL.std.450, storage-buffer blocks, a LocalSize entry), carried as the kernel's word stream. Vulkane owns SPIR-V."
keywords     = ["spirv", "vulkan", "codegen", "compiler", "shader"]
categories   = ["compilers", "development-tools", "graphics"]
repository   = "https://github.com/ThinkersJournal/vulkane"
homepage     = "https://github.com/ThinkersJournal/vulkane"
readme       = "README.md"
include      = ["src/**", "README.md", "LICENSE-*", "THIRD-PARTY-NOTICES.md"]

[dependencies]
rspirv         = "0.13.0"
unpopped       = "~0.60.1"
unpopped-vocab = "~0.60.1"
# Packed values (vectors) are scalarized before lowering: `unpopped`'s `lower_dag` has no seam for them.
vulkane-kernel-text = { path = "../vulkane-kernel-text", version = "0.30" }

[dev-dependencies]
# The published decline fixtures (ROADMAP 9h): one checker-valid kernel or module per `Stmt` variant.
unpopped = { version = "~0.60.1", features = ["fixtures"] }
# Shared test helpers (GPU lock witness, kernels, oracles): ROADMAP row 8n, in place of `#[path]` includes.
vulkane-test-support = { path = "../vulkane-test-support" }
# Reflection of the emitted module: entry point, workgroup size, bindings.
vulkane-spirv-parse = { path = "../vulkane-spirv-parse" }
# The live-device shift test opens a device through the safe wrapper (and its shared `tests/common`).
vulkane            = { path = "../vulkane" }
# G4.2: the host reference the device results are compared with.
unpopped-cpu-c     = "~0.60.1"
# Cross-check: the Slang emitter, compiled by `slangc`, against this one on the same device.
fishstringer-slang-emit = "~0.10.0"
tempfile           = { workspace = true }

[lints.rust]
missing_docs                  = "deny"
missing_debug_implementations = "warn"
unreachable_pub               = "warn"

[lints.rustdoc]
broken_intra_doc_links  = "deny"
private_intra_doc_links = "deny"

[lints.clippy]
all                = { level = "warn", priority = -1 }
too_many_arguments = "allow"
