[package]
name         = "vulkane-test-support"
version = "0.30.6"
edition      = "2024"
rust-version = "1.85"
authors      = ["Eric Evans <CireSnave@gmail.com>"]
license      = "MIT OR Apache-2.0"
description  = "Shared test support for the Vulkane workspace (GPU lock witness, kernels, oracles). Never published."
repository   = "https://github.com/ThinkersJournal/vulkane"
publish      = false

[dependencies]
unpopped           = "~0.60.1"
unpopped-vocab     = "~0.60.1"
tempfile           = { workspace = true }
# A dev-dependency cycle on purpose: these crates' tests depend on this one, and it needs them for the
# device harness (`gpu`) and the live-device helpers (`common`). Cargo allows it; this crate is never published.
vulkane            = { path = "../vulkane" }
vulkane-spirv-emit = { path = "../vulkane-spirv-emit" }
