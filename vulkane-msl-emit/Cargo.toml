[package]
name         = "vulkane-msl-emit"
version = "0.33.2"
edition      = "2024"
rust-version = "1.85"
authors      = ["Eric Evans <CireSnave@gmail.com>"]
license      = "MIT OR Apache-2.0"
description  = "The Metal Shading Language compute-kernel emitter for Unpopped: kernel-layer IR to MSL source (device buffers, threadgroup arrays, threadgroup_barrier, structured control flow) over the shared vulkane-kernel-text walker. Vulkane owns MSL."
keywords     = ["kernel", "codegen", "compiler", "metal", "shader"]
categories   = ["compilers", "development-tools", "graphics"]
repository   = "https://github.com/ThinkersJournal/vulkane"
homepage     = "https://github.com/ThinkersJournal/vulkane"
readme       = "README.md"
include      = ["src/**", "README.md", "LICENSE-*"]

[dependencies]
unpopped       = "~0.63.0"
unpopped-vocab = "~0.63.0"
vulkane-kernel-text = { path = "../vulkane-kernel-text", version = "0.33" }

[dev-dependencies]
# The published decline fixtures (ROADMAP 9h): the checker's divergent-placement refusals for the subgroup collectives.
unpopped = { version = "~0.63.0", features = ["fixtures"] }
# The shared kernels (reverse, flow, grid, ...) the other emitters' tests lower too.
vulkane-test-support = { path = "../vulkane-test-support" }

[lints.rust]
missing_docs                  = "deny"
missing_debug_implementations = "warn"
unreachable_pub               = "warn"

[lints.rustdoc]
broken_intra_doc_links  = "deny"
private_intra_doc_links = "deny"

[lints.clippy]
all                = { level = "warn", priority = -1 }
too_many_arguments = "allow"
type_complexity    = "allow"
