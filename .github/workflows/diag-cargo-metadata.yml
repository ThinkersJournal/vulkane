# TEMPORARY DIAGNOSTIC (vulkane#187): `cargo metadata --no-deps` exited 1 inside the local-gates self-test and the harness hides its
# stderr. This job runs the same command on the same tree and shows stderr. Removed in the next commit once the cause is read.
name: Diag cargo metadata
on:
  pull_request:
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable (branch HEAD)
      - name: Install the pinned toolchain
        shell: bash
        run: |
          set -euo pipefail
          pinned="$(grep -m1 '^channel' rust-toolchain.toml | cut -d'"' -f2)"
          rustup toolchain install "$pinned" --profile minimal
          cargo "+$pinned" --version
      - name: cargo metadata, stderr visible
        shell: bash
        run: |
          set +e
          echo "first plain cargo after the +pinned probe (as in the self-test job):"
          RUST_BACKTRACE=1 cargo metadata --no-deps --format-version 1 > /tmp/meta.json 2> /tmp/meta.err
          echo "exit=$?"
          echo "--- stderr:"
          cat /tmp/meta.err
          echo "--- stdout bytes: $(wc -c < /tmp/meta.json)"
          exit 0
      - name: the same through msrv_matrix.py (as the harness runs it)
        shell: bash
        run: |
          set +e
          python3 .github/msrv_matrix.py > /tmp/m.out 2> /tmp/m.err
          echo "msrv_matrix exit=$?"
          cat /tmp/m.err | head -20
          exit 0
      - name: the WHOLE self-test, with a cargo shim that records every failing call's stderr
        shell: bash
        run: |
          set +e
          python3 -m pip install --quiet pyyaml
          mkdir -p "$RUNNER_TEMP/shim"
          cat > "$RUNNER_TEMP/shim/cargo" <<'SHIM'
          #!/bin/bash
          err="$(mktemp)"
          "$HOME/.cargo/bin/cargo" "$@" 2> "$err"
          rc=$?
          cat "$err" >&2
          if [ $rc -ne 0 ]; then { echo "=== cargo $* -> exit $rc (cwd $PWD)"; cat "$err"; } >> "$RUNNER_TEMP/cargo-failures.log"; fi
          rm -f "$err"
          exit $rc
          SHIM
          chmod +x "$RUNNER_TEMP/shim/cargo"
          PATH="$RUNNER_TEMP/shim:$PATH" python3 .github/local_gates.py --self-test > "$RUNNER_TEMP/self.out" 2>&1
          echo "self-test exit=$?"
          echo "--- tail of self-test:"; tail -25 "$RUNNER_TEMP/self.out"
          echo "--- failing cargo calls:"; cat "$RUNNER_TEMP/cargo-failures.log" 2>/dev/null || echo "(none recorded)"
          exit 0

