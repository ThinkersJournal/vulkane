# TEMPORARY DIAGNOSTIC (vulkane#187): `cargo metadata --no-deps` exited 1 inside the local-gates self-test and the harness hides its
# stderr. This job runs the same command on the same tree and shows stderr. Removed in the next commit once the cause is read.
name: Diag cargo metadata
on:
  pull_request:
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable (branch HEAD)
      - name: Install the pinned toolchain
        shell: bash
        run: |
          set -euo pipefail
          pinned="$(grep -m1 '^channel' rust-toolchain.toml | cut -d'"' -f2)"
          rustup toolchain install "$pinned" --profile minimal
      - name: cargo metadata, stderr visible
        shell: bash
        run: |
          set +e
          cargo --version
          RUST_BACKTRACE=1 cargo metadata --no-deps --format-version 1 > /tmp/meta.json 2> /tmp/meta.err
          echo "exit=$?"
          echo "--- stderr:"
          cat /tmp/meta.err
          echo "--- stdout bytes: $(wc -c < /tmp/meta.json)"
          exit 0
